spring.application.name=blacklotus
spring.datasource.url=jdbc:mysql://localhost:3306/blacklotus
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Crear y actualizar tablas durante el desarrollo
spring.jpa.hibernate.ddl-auto=update

# Mostrar el SQL y hacerlo más legible
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Importación explícita y repetible de JSONL local. Activar sólo para la carga.
scryfall.import.enabled=false
scryfall.import.file=data/commander-cards-scryfall.jsonl
scryfall.import.batch-size=250
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
